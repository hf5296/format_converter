version: '3.8'

services:
  format-converter:
    build: .
    container_name: format-converter
    restart: unless-stopped
    ports:
      - "8085:8000"
    volumes:
      - converter_temp:/tmp/format_converter
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  converter_temp:
